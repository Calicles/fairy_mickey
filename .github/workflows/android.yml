name: Android APK

on:
  push:
    paths:
      - 'src/main/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # le paquet "tools" installé par défaut n'existe plus dans le SDK récent
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4

      # même clé de signature d'une compilation à l'autre : l'APK se met à jour sans désinstaller
      - name: Clé de signature debug
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Compilation de l'APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Renommage
        run: cp android/app/build/outputs/apk/debug/app-debug.apk fairy_mickey.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fairy_mickey-apk
          path: fairy_mickey.apk

      - name: Publication dans la release android-latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest fairy_mickey.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Fairy Mickey Android (version de test)" \
            --notes "APK de test compilé automatiquement depuis main (commit ${GITHUB_SHA::7}).

          Installation : ouvrir ce lien depuis le téléphone, télécharger fairy_mickey.apk puis l'ouvrir ; Android demande d'autoriser l'installation depuis le navigateur ou le gestionnaire de fichiers."
